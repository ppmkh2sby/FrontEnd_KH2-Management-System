server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The application needs camera access only from its own top-level origin.
    # Browsers still require HTTPS for live getUserMedia preview.
    add_header Permissions-Policy "camera=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Preserve HTTPS information from a trusted upstream proxy such as
    # Cloudflare Tunnel or Azure Application Gateway; fall back to this Nginx
    # connection scheme for direct requests.
    set $backend_forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $backend_forwarded_proto $http_x_forwarded_proto;
    }

    # Docker's embedded DNS lets Nginx re-resolve a recreated backend container
    # instead of keeping the previous container IP until Nginx is restarted.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream ${BACKEND_UPSTREAM};

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
    }

    # Vite fingerprints JavaScript and CSS. Cache these files aggressively so
    # repeat visits do not download the application bundle again.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Landing images are optimized WebP files and can be reused across visits.
    location ~* \.(?:webp|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
