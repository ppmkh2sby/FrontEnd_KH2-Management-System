server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve HTTPS information from a trusted upstream proxy such as
    # Cloudflare Tunnel or Azure Application Gateway; fall back to this Nginx
    # connection scheme for direct requests.
    set $backend_forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $backend_forwarded_proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
